# AI Banking App — Docker Compose
#
# Images are pulled from Docker Hub — nothing is built locally.
#
# Prerequisites:
#   1. Copy .env.example to .env and fill in all required values.
#   2. Make sure the image has been pushed to Docker Hub:
#        ishakantony/ai-banking-app:latest
#
# Usage:
#   docker compose pull
#   docker compose up -d

services:
  app:
    image: ishakantony/ai-banking-app:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
